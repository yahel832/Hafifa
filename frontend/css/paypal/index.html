<!doctype html>
<html>
  <head>
    <title>Log in to your PayPal account</title>
    <link rel="icon" type="image/x-icon" href="/paypalicon.png" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="center-content">
      <img src="/paypalogo.png" alt="paypal logo" height="35" />
      <form>
        <input type="text" id="email" placeholder="Email" />
        <br />
        <input type="text" id="password" placeholder="Password" />
      </form>
      <br />
      <button id="blue-button"><b>Log In</b></button>
      <br /><br />
      <a id="trouble" href="#">Having trouble logging in?</a>
      <hr />
      <button id="grey-button"><b>Sign Up</b></button>
    </div>
    <div class="navbar">
      <a href="#">Contact Us</a>
      <a href="#">Privacy</a>
      <a href="#">Legal</a>
      <a href="#">Worldwide</a>
    </div>
  </body>
</html>
