<!doctype html>
<html>
  <head>
    <title>Fill The Form</title>
  </head>
  <body>
    <h1>Fill out this form</h1>
    <form action="/krustykrab/orders" method="POST">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" required />
      <br /><br />
      <legend>Gender:</legend>
      <input type="radio" id="gender1" name="gender" value="Male" />
      <label for="gender1">Male</label><br />
      <input type="radio" id="gender2" name="gender" value="Female" />
      <label for="gender2">Female</label><br />
      <input type="radio" id="gender3" name="gender" value="Other" />
      <label for="gender3">Other</label>
      <br /><br />
      <label for="age">Age:</label>
      <input type="number" id="age" min="1" max="120" step="1" />
      <br /><br />
      <label for="dob">Birthdate:</label>
      <input type="date" id="dob" />
      <br /><br />
      <label for="favcolor">Favorite Color:</label>
      <input type="color" id="favcolor" value="#ff0000" />
      <br /><br />
      <label for="slevel">Satisfaction level:</label>
      <input type="number" id="slevel" min="1" max="10" step="1" />
      <br /><br />
      <label for="phone">Phone Number:</label>
      <input
        type="tel"
        id="phone"
        placeholder="000-0000000"
        pattern="[0-9]{3}-[0-9]{7}"
        required
      />
      <br /><br />
      <label for="email_address">Email Address:</label>
      <input type="email" id="email_address" />
      <br /><br />
      <label for="address">Address:</label>
      <input type="text" id="address" required />
      <br /><br />
      <label for="food">Choose A Food:</label>
      <select id="food">
        <option value="krabpatty">Krab Patty</option>
        <option value="dkrabpatty">Double Krab Patty</option>
        <option value="colorpatty">Color Patty</option>
        <option value="pizza">Pizza</option>
      </select>
      <br /><br />
      <legend><label for="message">Message For Delivery:</label></legend>
      <textarea id="message"></textarea>
      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
